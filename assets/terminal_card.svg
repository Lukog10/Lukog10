<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00638E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#004A6B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2B2B2B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00638E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .bar-title { font-size: 13px; fill: #8CB9CC; font-weight: 500; }
      .t-key { font-size: 13px; fill: #8CB9CC; font-weight: 500; }
      .t-str { font-size: 13px; fill: #FFFFFF; font-weight: 400; }
      .t-val { font-size: 13px; fill: #BFD8E3; font-weight: 400; }
      .t-punct { font-size: 13px; fill: #527588; }
      .t-bracket { font-size: 13px; fill: #00638E; font-weight: 600; }
    </style>
  </defs>

  <!-- Card Body -->
  <rect x="1" y="1" width="848" height="418" rx="8" fill="#0d1117" stroke="url(#cardBorder)" stroke-width="1.5"/>
  <rect x="1" y="1" width="848" height="418" rx="8" fill="url(#cardGlow)"/>

  <!-- Window Header Bar -->
  <path d="M 1 9 A 8 8 0 0 1 9 1 L 841 1 A 8 8 0 0 1 849 9 L 849 38 L 1 38 Z" fill="#141414" stroke="#2B2B2B" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#2B2B2B" stroke="#00638E" stroke-width="1.5"/>
  <circle cx="36" cy="19" r="5" fill="#2B2B2B" stroke="#004A6B" stroke-width="1.5"/>
  <circle cx="52" cy="19" r="5" fill="#2B2B2B" stroke="#8CB9CC" stroke-width="1.5"/>

  <text x="75" y="23" class="mono bar-title">gokul@workspace:~$ whoami --developer</text>

  <!-- JSON Content -->
  <g transform="translate(30, 68)">
    <text x="0" y="0" class="mono t-bracket">{</text>

    <text x="24" y="24" class="mono">
      <tspan class="t-key">"developer"</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"Gokul"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <text x="24" y="48" class="mono">
      <tspan class="t-key">"role"</tspan><tspan class="t-punct">:</tspan> <tspan class="t-val">"Developer &amp; Freelancer"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <text x="24" y="74" class="mono">
      <tspan class="t-key">"focus"</tspan><tspan class="t-punct">: [</tspan>
    </text>
    <text x="48" y="96" class="mono">
      <tspan class="t-str">"Data Analytics"</tspan><tspan class="t-punct">,</tspan> <tspan class="t-str">"ML &amp; AI Engineering"</tspan><tspan class="t-punct">,</tspan>
    </text>
    <text x="48" y="118" class="mono">
      <tspan class="t-str">"Web Development"</tspan><tspan class="t-punct">,</tspan> <tspan class="t-str">"Frontend &amp; UI/UX Design"</tspan>
    </text>
    <text x="24" y="140" class="mono t-bracket">],</text>

    <text x="24" y="166" class="mono">
      <tspan class="t-key">"open_source"</tspan><tspan class="t-punct">: {</tspan>
    </text>

    <text x="48" y="190" class="mono">
      <tspan class="t-key">"projects"</tspan><tspan class="t-punct">: {</tspan>
    </text>
    <text x="72" y="212" class="mono">
      <tspan class="t-key">"Orbix"</tspan><tspan class="t-punct">:</tspan> <tspan class="t-val">"Windows notch &amp; dock interface with dynamic island and hardware stats"</tspan><tspan class="t-punct">,</tspan>
    </text>
    <text x="72" y="234" class="mono">
      <tspan class="t-key">"WizDesk"</tspan><tspan class="t-punct">:</tspan> <tspan class="t-val">"Desktop productivity suite engineered for developer workflows"</tspan>
    </text>
    <text x="48" y="256" class="mono t-bracket">},</text>

    <text x="48" y="280" class="mono">
      <tspan class="t-key">"contributions"</tspan><tspan class="t-punct">: [</tspan>
    </text>
    <text x="72" y="302" class="mono">
      <tspan class="t-str">"New software for the open source community (Orbix, WizDesk)"</tspan><tspan class="t-punct">,</tspan>
    </text>
    <text x="72" y="324" class="mono">
      <tspan class="t-str">"Workflow automation, community tooling, and upstream bug fixes"</tspan>
    </text>
    <text x="48" y="344" class="mono t-bracket">]</text>

    <text x="24" y="364" class="mono t-bracket">}</text>
    <text x="0" y="386" class="mono t-bracket">}</text>
  </g>
</svg>
