<text x="475" y="45">
  <tspan x="475" y="45" class="hdr">Gokul</tspan><tspan class="rule"> --------------------------------------------------------------</tspan>
  <tspan x="475" y="66"><tspan class="dots">. </tspan><tspan class="key">Role</tspan><tspan class="dots">:</tspan><tspan class="dots"> .................................... </tspan><tspan class="val">Developer &amp; Freelancer</tspan></tspan>
  <tspan x="475" y="87"><tspan class="dots">. </tspan><tspan class="key">Focus</tspan><tspan class="dots">:</tspan><tspan class="dots"> ................. </tspan><tspan class="val">Data Analytics, ML &amp; AI, Web Development</tspan></tspan>
  <tspan x="475" y="108"><tspan class="dots">. </tspan><tspan class="key">Languages.Core</tspan><tspan class="dots">:</tspan><tspan class="dots"> ..................................... </tspan><tspan class="val">Python, SQL</tspan></tspan>
  <tspan x="475" y="129"><tspan class="dots">. </tspan><tspan class="key">ML.Libraries</tspan><tspan class="dots">:</tspan><tspan class="dots"> ........ </tspan><tspan class="val">PyTorch, TensorFlow, Pandas, NumPy, Scikit</tspan></tspan>
  <tspan x="475" y="150"><tspan class="dots">. </tspan><tspan class="key">Analytics.BI</tspan><tspan class="dots">:</tspan><tspan class="dots"> ................................. </tspan><tspan class="val">Power BI, Tableau</tspan></tspan>
  <tspan x="475" y="171"><tspan class="dots">. </tspan><tspan class="key">Web.Frontend</tspan><tspan class="dots">:</tspan><tspan class="dots"> ........ </tspan><tspan class="val">React, TypeScript, Tailwind CSS, HTML, CSS</tspan></tspan>
  <tspan x="475" y="192"><tspan class="dots">. </tspan><tspan class="key">Design</tspan><tspan class="dots">:</tspan><tspan class="dots"> ................................ </tspan><tspan class="val">Figma, UI/UX Prototyping</tspan></tspan>
  <tspan x="475" y="234" class="hdr">- Open Source</tspan><tspan class="rule"> ------------------------------------------------------</tspan>
  <tspan x="475" y="255"><tspan class="dots">. </tspan><tspan class="key">Orbix</tspan><tspan class="dots">:</tspan><tspan class="dots"> ....... </tspan><tspan class="val">Windows notch &amp; dock with dynamic island &amp; widgets</tspan></tspan>
  <tspan x="475" y="276"><tspan class="dots">. </tspan><tspan class="key">WizDesk</tspan><tspan class="dots">:</tspan><tspan class="dots"> .......... </tspan><tspan class="val">Desktop utility suite for developer workflows</tspan></tspan>
  <tspan x="475" y="297"><tspan class="dots">. </tspan><tspan class="key">Contributions</tspan><tspan class="dots">:</tspan><tspan class="dots">  </tspan><tspan class="val">New software releases, community tools, bug fixes</tspan></tspan>
  <tspan x="475" y="339" class="hdr">- Tooling &amp; AI Environment</tspan><tspan class="rule"> -----------------------------------------</tspan>
  <tspan x="475" y="360"><tspan class="dots">. </tspan><tspan class="key">Environment</tspan><tspan class="dots">:</tspan><tspan class="dots"> ................... </tspan><tspan class="val">Git, GitHub, Docker, Linux, Bash</tspan></tspan>
  <tspan x="475" y="381"><tspan class="dots">. </tspan><tspan class="key">Editors</tspan><tspan class="dots">:</tspan><tspan class="dots"> ........................................... </tspan><tspan class="val">VS Code, Zed</tspan></tspan>
  <tspan x="475" y="402"><tspan class="dots">. </tspan><tspan class="key">AI.Ecosystem</tspan><tspan class="dots">:</tspan><tspan class="dots"> ......... </tspan><tspan class="val">Claude Code, Open Code, Ollama, LM Studio</tspan></tspan>
  <tspan x="475" y="444" class="hdr">- Contact &amp; Socials</tspan><tspan class="rule"> ------------------------------------------------</tspan>
  <tspan x="475" y="465"><tspan class="dots">. </tspan><tspan class="key">Email.Personal</tspan><tspan class="dots">:</tspan><tspan class="dots"> ........................... </tspan><tspan class="val">gokulr.1105@gmail.com</tspan></tspan>
  <tspan x="475" y="486"><tspan class="dots">. </tspan><tspan class="key">GitHub</tspan><tspan class="dots">:</tspan><tspan class="dots"> ...................................... </tspan><tspan class="val">github.com/Lukog10</tspan></tspan>
  <tspan x="475" y="507"><tspan class="dots">. </tspan><tspan class="key">Status</tspan><tspan class="dots">:</tspan><tspan class="dots"> ..... </tspan><tspan class="val">Available for projects &amp; open source collaborations</tspan></tspan>
  <tspan x="475" y="528" class="rule">--------------------------------------------------------------------</tspan>
</text>
